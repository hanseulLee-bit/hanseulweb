<!DOCTYPE html>
<html>
<head>
  <title>시</title>
  <style>
    @font-face {
            font-family: 'Griun_Cocochoitoon-Rg';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-1@1.0/Griun_Cocochoitoon-Rg.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }
    body {
  font-family: "Griun_Cocochoitoon-Rg", sans-serif;
    }
    h1{
      color: #e76668;
    }
    p {
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>청춘</h1>
  <p>거센소리로 머물다가</p>
  <p>된소리로 떠나는 일</p>
  <p>칼이 꽃이 되는 일</p>
  <p>피가 뼈가 되는 </p>
  <p>&nbsp;</p>
  <p>어떤 날에는 </p>
  <p>내 손이 마음대로 움직이지 않았다</p>
  <p>내 손은 내가 아니니까</p>
  <p>내 마음이 아니니</p>
  <p>&nbsp;</p>
  <p>자유는 늘 부자연스러웠다</p>
  <p>&nbsp;</p>
  <p>몸의 부기를 빼는 </p>
  <p>마음을 더는 일</p>
  <p>다시</p>
  <p>예사소리로 되돌리는 </p>
  <p>&nbsp;</p>
  <p>꿈에 나와 길 위에 섰다</p>
  <p>아직 꿈길 같았다</p>
  <p>&nbsp;</p>
  <p>-오은-</p>
</body>
</html>
