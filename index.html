<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>시 - 청춘 (하늘색 배경)</title>
  <style>
    @font-face {
        font-family: 'Griun_Cocochoitoon-Rg';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-1@1.0/Griun_Cocochoitoon-Rg.woff2') format('woff2');
        font-weight: normal;
        font-display: swap;
    }
    
    body, html {
      margin: 0;
      padding: 0;
      min-height: 100%;             
      font-family: "Griun_Cocochoitoon-Rg", sans-serif;
      background-color: #e3f2fd;    
    }

    .centering-container {
      display: flex;
      justify-content: center;       
      align-items: center;          
      min-height: 100vh;            
      padding: 40px 0;               
      box-sizing: border-box;
      text-align: center;           
    }

    .poem-box {
      background-color: #ffffff;     
      padding: 40px 60px;
      border-radius: 15px;           
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      max-width: 450px;       
      width: 90%;                 
    }

    h1 {
      color: #e76668;
      margin-bottom: 5px;
      display: inline-block;
    }

    .author {
      display: inline-block;
      margin-left: 20px;
      color: #777777;               
      font-size: 0.85em;
    }

    p {
      color: #333333;
      margin: 0;
      line-height: 1.8;
    }

    .end-author {
        color: #888888;
        font-size: 0.9em;
        margin-top: 25px;
    }

  </style>
</head>
<body>

  <div class="centering-container">
    <div class="poem-box">

      <h1>청춘</h1> <span class="author">오은</span>
      
      <p>&nbsp;</p>
      <p>&nbsp;</p>

      <p>거센소리로 머물다가</p>
      <p>된소리로 떠나는 일</p>
      <p>칼이 꽃이 되는 일</p>
      <p>피가 뼈가 되는 </p>
      <p>&nbsp;</p>
      <p>어떤 날에는 </p>
      <p>내 손이 마음대로 움직이지 않았다</p>
      <p>내 손은 내가 아니니까</p>
      <p>내 마음이 아니니</p>
      <p>&nbsp;</p>
      <p>자유는 늘 부자연스러웠다</p>
      <p>&nbsp;</p>
      <p>몸의 부기를 빼는 </p>
      <p>마음을 더는 일</p>
      <p>다시</p>
      <p>예사소리로 되돌리는 </p>
      <p>&nbsp;</p>
      <p>꿈에 나와 길 위에 섰다</p>
      <p>아직 꿈길 같았다</p>

      <p class="end-author">-오은-</p>

    </div>
  </div>

</body>
</html>
